<script>
(() => {
  const root = document.getElementById('rowan-combat-review');
  const video = root.querySelector('video');
  const select = root.querySelector('select');
  const apply = state => {
    const chapter = state?.privateContent?.chapter;
    if ([...select.options].some(option => option.value === chapter)) {
      select.value = chapter;
      video.currentTime = Number(chapter);
    }
  };
  video.addEventListener('loadedmetadata', () => apply(window.openai?.widgetState), { once: true });
  window.addEventListener('openai:set_globals', event => apply(event.detail?.globals?.widgetState));
  select.addEventListener('change', () => {
    video.currentTime = Number(select.value);
    video.play().catch(() => {});
    window.openai?.setWidgetState?.({
      modelContent: { action: select.selectedOptions[0].textContent },
      privateContent: { chapter: select.value }
    }).catch(() => {});
  });
})();
</script>
