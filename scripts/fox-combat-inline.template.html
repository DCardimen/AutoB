<div id="rowan-combat-review">
  <div class="viz-controls">
    <label class="form-label">Combat movement
      <select class="form-select" aria-label="Preview combat movement">
        <option value="0">Crouched shot</option>
        <option value="2.2">Double shot</option>
        <option value="4.4">Shoot moving forward</option>
        <option value="6.6">Shoot strafing left</option>
        <option value="8.8">Dash forward</option>
        <option value="9.5">Dodge left</option>
        <option value="10.3">Dodge right</option>
        <option value="11.1">Duck</option>
        <option value="11.8">Hit reaction</option>
        <option value="12.8">Turn left 90</option>
        <option value="13.4">Turn right 45</option>
        <option value="13.82">Quick turn 180</option>
        <option value="14.44">Run stop</option>
        <option value="15.06">Run stop and turn 180</option>
        <option value="15.96">Dash back</option>
        <option value="16.62">Shoot kiting back-left</option>
        <option value="18.82">Fall</option>
      </select>
    </label>
  </div>
  <video controls playsinline muted preload="auto" poster="@@POSTER@@" aria-label="Archer v2 fox combat movement at normal speed" style="display:block;width:100%;aspect-ratio:1;object-fit:contain" src="data:video/webm;base64,@@VIDEO@@"></video>
</div>
<script>
(() => {
  const root = document.getElementById('rowan-combat-review');
  const video = root.querySelector('video');
  const select = root.querySelector('select');
  const apply = state => {
    const chapter = state?.privateContent?.chapter;
    if ([...select.options].some(option => option.value === chapter)) {
      select.value = chapter;
      video.currentTime = Number(chapter);
    }
  };
  video.addEventListener('loadedmetadata', () => apply(window.openai?.widgetState), { once: true });
  window.addEventListener('openai:set_globals', event => apply(event.detail?.globals?.widgetState));
  select.addEventListener('change', () => {
    video.currentTime = Number(select.value);
    video.play().catch(() => {});
    window.openai?.setWidgetState?.({
      modelContent: { action: select.selectedOptions[0].textContent },
      privateContent: { chapter: select.value }
    }).catch(() => {});
  });
})();
</script>
