name: Build and verify field UI
on:
  pull_request:
    branches: [codex/starfall-menagerie, 'feat/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: field-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  field-ui:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
      - run: npm run build:prototype
      - run: npx playwright install --with-deps chromium
      - name: Start the game
        run: |
          npm start > /tmp/field-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/field-server.log
          exit 1
      - run: node tests/field-ui.browser.mjs
      - run: node tests/chaos-combat.browser.mjs
      - run: node tests/live-roster.browser.mjs
      - run: node tests/relic-supplies.browser.mjs
      - run: node tests/capture-recruitment.browser.mjs
      - run: node tests/creature-anatomy.browser.mjs
      - run: node tests/arena-elite.browser.mjs
      - run: node tests/settings-movement.browser.mjs
      - run: node scripts/review-creature-anatomy.mjs
      - run: node scripts/review-melee-weapons.mjs
      - run: node scripts/review-natural-carry.mjs
      - run: node scripts/review-swing-body.mjs
      - run: node scripts/review-leg-volume.mjs
      - run: node tests/prototype.browser.mjs
      - name: Package the playable offline game
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('public/Starfall-Reference-UI.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('Starfall-Menagerie.html')
              z.writestr('README.txt', 'Extract and open Starfall-Menagerie.html in Chrome, Firefox, or Edge. The complete game, fonts, and three world paintings are embedded. Keep the same file location to retain the device save.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Starfall-Reference-UI
          path: |
            Starfall-Menagerie.html
            Starfall-Training-Glade.html
            public/Starfall-Reference-UI.zip
            playtest-artifacts/field-*.png
            playtest-artifacts/melee-*.png
            playtest-artifacts/natural-carry-*.png
            tests/reports/natural-melee-carry.json
            playtest-artifacts/swing-body-*.png
            tests/reports/swing-body.json
            playtest-artifacts/leg-volume-*.png
            public/leg-volume-preview.webm
            tests/reports/leg-volume.json
            tests/reports/melee-weapon-ui.json
            tests/reports/field-ui-v3.json
            CHAOS-COMBAT.md
            playtest-artifacts/chaos-*.png
            playtest-artifacts/chaos-combat-browser.json
            playtest-artifacts/live-roster-*.png
            playtest-artifacts/live-roster-browser.json
            playtest-artifacts/relic-supplies-*.png
            playtest-artifacts/relic-supplies-browser.json
            playtest-artifacts/capture-recruitment-*.png
            playtest-artifacts/capture-recruitment-browser.json
            playtest-artifacts/creature-anatomy-*.png
            playtest-artifacts/creature-anatomy-browser.json
            tests/reports/creature-anatomy.json
            public/creature-anatomy-preview.webm
            CREATURE-ANATOMY.md
            ARENA-ELITES.md
            playtest-artifacts/arena-ui-*.png
            playtest-artifacts/arena-elite-*.png
            playtest-artifacts/arena-elite-browser.json
            playtest-artifacts/settings-movement-*.png
            playtest-artifacts/settings-movement-browser.json
            RELIC-DESIGN.md
