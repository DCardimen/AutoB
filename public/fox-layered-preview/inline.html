const node=(x,y,pinned=false)=>({x,y,px:x,py:y,pinned});

function createDynamics(form='rowan'){

function stepDynamics(sim,pose,elapsed,wind=1){

   pin(tail.nodes[0],pose.tailRoot.x,pose.tailRoot.y);
   const release=pose.releaseAge>=0?Math.exp(-pose.releaseAge*5)*Math.sin(pose.releaseAge*15-tail.index*.38):0;

}

const lerp=(a,b,t)=>a+(b-a)*t;
function prepareKit(image,metadata){

function fit(ctx,part,x,y,w,h){

}
function bone(ctx,part,a,b,widthScale=1){

let meshSurface,meshContext,meshFrame,meshSize=0;
function triangle(out,part,s0,s1,s2,p0,p1,p2,size){

function mesh(ctx,part,cols,rows,map,vmin=0){

function inspect(){
 $('parts').replaceChildren();const kit=kits.find(k=>k.form===$('parts-form').value);
 for(const [name,part]of Object.entries(kit.parts)){const div=document.createElement('div'),canvas=document.createElement('canvas'),label=document.createElement('span');div.className='part';canvas.width=canvas.height=128;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;const scale=Math.min(112/part.w,112/part.h);ctx.drawImage(part.image,64-part.w*scale/2,64-part.h*scale/2,part.w*scale,part.h*scale);label.textContent=name;div.append(canvas,label);$('parts').append(div);}
}
$('parts-form').onchange=inspect;inspect();
function tick(now){
 const delta=last?Math.min(.25,(now-last)/1000):0;last=now;const dt=paused?0:delta*Number($('speed').value);time+=dt;
 let pose,errors=[];
 for(const actor of actors){pose=poseAt($('action').value,time,{stride:Number($('stride').value),bowProfile:actor.kit.bowProfile,stocky:manifest.stocky});actor.pose=pose;stepDynamics(actor.sim,pose,dt,Number($('wind').value));renderCharacter(actor.buffer.getContext('2d'),actor.kit,pose,actor.sim,{guides:$('guides').checked});renderScene(actor.canvas,actor.buffer,pose,actor.kit);errors.push(dynamicsErrors(actor.sim,pose));}
 $('status').textContent=pose.attackPhase+' · right-hand grip attached · '+(pose.blink?'blink':'eyes open');
 root.dataset.ready='true';root.dataset.action=$('action').value;
 window.foxLayeredPreview={actors,pose,errors,paused,seek:value=>{time=value;}};requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function applyWidgetState(state){
 const m=state?.modelContent,p=state?.privateContent;
 if(['idle','run','attack'].includes(m?.action))$('action').value=m.action;
 if(Number.isFinite(m?.stride))$('stride').value=String(Math.max(.5,Math.min(1.5,m.stride)));
 if(Number.isFinite(m?.wind))$('wind').value=String(Math.max(0,Math.min(2,m.wind)));
 if([1,.5,.25].includes(p?.speed))$('speed').value=String(p.speed);
 if(typeof p?.paused==='boolean')paused=p.paused;
 if(typeof p?.guides==='boolean')$('guides').checked=p.guides;
 $('pause').textContent=paused?'Play':'Pause';
}
function saveWidgetState(){
 if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'stocky fox SW motion',action:$('action').value,stride:Number($('stride').value),wind:Number($('wind').value)},privateContent:{paused,speed:Number($('speed').value),guides:$('guides').checked}}).catch(()=>{});
}
applyWidgetState(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)applyWidgetState(e.detail.globals.widgetState);});
root.addEventListener('change',saveWidgetState);$('pause').addEventListener('click',saveWidgetState);
})();
</script>
</div>
