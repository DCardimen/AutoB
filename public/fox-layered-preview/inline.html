<script>
(async()=>{
// Isolated one-facing art/rig study. This module is not loaded by the game.
const CELL=64;
const FORMS=['rowan','mature','moontrail'];
const PARTS=['head-open','head-closed','torso','upper-right','fore-right','upper-left','fore-left','thigh-right','calf-right','thigh-left','calf-left','cape','tail','bow','quiver','arrow'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mix=(a,b,t)=>a+(b-a)*t;
const point=(a,b,t)=>({x:mix(a.x,b.x,t),y:mix(a.y,b.y,t)});
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function ik(root,end,upper,lower,bend=-1){
 const dx=end.x-root.x,dy=end.y-root.y,actual=Math.hypot(dx,dy)||.001,d=clamp(actual,Math.abs(upper-lower)+.001,upper+lower-.001),ux=dx/actual,uy=dy/actual;
 const a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));
 return {root:{...root},joint:{x:root.x+ux*a-uy*h*bend,y:root.y+uy*a+ux*h*bend},end:{x:root.x+ux*d,y:root.y+uy*d},upper,lower};
}
function foot(phase,stride){
 const p=((phase%1)+1)%1,stance=.62;
 if(p<stance)return {x:mix(-stride/2,stride/2,p/stance),y:0,support:true};
 const q=(p-stance)/(1-stance);return {x:mix(stride/2,-stride/2,smooth(q)),y:-5.2*Math.sin(q*Math.PI),support:false};
}
function poseAt(action,time,{stride=1,bowProfile=null}={}){
 const moving=action==='run',attack=action==='attack',phase=time/ .57,breath=Math.sin(time*2.8)*.15;
 const bodyY=moving?Math.sin(phase*Math.PI*4)*.2:breath;
 const hipR={x:28,y:43+bodyY},hipL={x:35,y:43+bodyY},shoulderR={x:25,y:33+bodyY},shoulderL={x:36,y:33+bodyY};
 const feet=[{x:28,y:53,support:true},{x:35,y:53,support:true}];
 if(moving){for(let side=0;side<2;side++){const f=foot(phase+side*.5,8*stride);feet[side]={x:[28,35][side]+f.x,y:53+f.y,support:f.support};}}
 let right={x:22,y:40+bodyY},left={x:40,y:40+bodyY},draw=0,attackPhase='Relaxed idle',releaseAge=-1;
 const shotTime=((time%2.35)+2.35)%2.35;
 if(moving){right={x:21+Math.sin(phase*Math.PI*2)*.6,y:37+bodyY};left={x:39+Math.sin(phase*Math.PI*2)*2,y:39+Math.cos(phase*Math.PI*2)*1.3};attackPhase='Run · alternating support';}
 if(attack){
  const raise=smooth(shotTime/.25),recover=smooth((shotTime-1.23)/.42),aim={x:17,y:31};
  right=point(point(right,aim,raise),right,recover);
  if(shotTime<.25)attackPhase='Anticipation · plant & raise';
  else if(shotTime<.43)attackPhase='Nock · left hand to string';
  else if(shotTime<.85)attackPhase='Draw · left hand to cheek';
  else if(shotTime<1.05)attackPhase='Aim · full draw';
  else if(shotTime<1.13)attackPhase='Release · string snap';
  else if(shotTime<1.4)attackPhase='Follow-through · tail wave';
  else attackPhase='Recovery · cloth & tail settle';
  draw=smooth((shotTime-.43)/.42)*(1-smooth((shotTime-1.05)/.055));
  const nock={x:22,y:31},cheek={x:29,y:28},recoil={x:32,y:27};
  const setup=smooth((shotTime-.15)/.28);
  left=point(left,point(nock,cheek,smooth((shotTime-.43)/.42)),setup);
  if(shotTime>=1.05)left=point(left,recoil,smooth((shotTime-1.05)/.06));
  if(shotTime>=1.25)left=point(left,{x:40,y:40+bodyY},recover);
  if(shotTime>=1.05)releaseAge=shotTime-1.05;
 }
 const nearArm=ik(shoulderR,right,7,8,-1),farArm=ik(shoulderL,left,7,8,1);
 const bowGrip={...nearArm.end},topOffset=bowProfile?.top||{x:4,y:-15},bottomOffset=bowProfile?.bottom||{x:4,y:15};
 const top={x:bowGrip.x+topOffset.x,y:bowGrip.y+topOffset.y},bottom={x:bowGrip.x+bottomOffset.x,y:bowGrip.y+bottomOffset.y};
 const engaged=attack&&shotTime>=.43&&shotTime<1.05,stringDraw=engaged?{...farArm.end}:point(top,bottom,.5);
 const blinkPhase=time%3.5,blink=!attack&&!moving&&blinkPhase>2.85&&blinkPhase<3.0;
 const legs=[hipR,hipL].map((hip,i)=>({...ik(hip,{x:feet[i].x,y:feet[i].y-3},6,5,1),foot:{x:feet[i].x,y:feet[i].y}}));
 const releaseGrip=ik(shoulderR,{x:17,y:31},7,8,-1).end,releaseNock=ik(shoulderL,{x:29,y:28},7,8,1).end,releaseRest={x:releaseGrip.x,y:releaseGrip.y-.5};
 const dx=releaseRest.x-releaseNock.x,dy=releaseRest.y-releaseNock.y,d=Math.hypot(dx,dy);
 const releasedArrow={nock:releaseNock,rest:releaseRest,velocity:{x:dx/d*125,y:dy/d*125}};
 return {action,time,moving,attack,phase,bodyY,feet,legs,arms:{right:nearArm,left:farArm},bow:{hand:'right',drawHand:'left',grip:bowGrip,top,bottom,draw:stringDraw,drawAmount:draw,engaged},drawAmount:draw,attackPhase,shotTime,releaseAge,releasedArrow,blink,tailRoot:{x:35,y:42+bodyY},capeRoot:{x:34,y:29+bodyY},head:{x:29,y:19+bodyY*.8}};
}

const node=(x,y,pinned=false)=>({x,y,px:x,py:y,pinned});
function link(a,b,rest=distance(a,b),stiffness=1){return {a,b,rest,stiffness};}
function solve(links){for(const l of links){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1,e=(d-l.rest)/d*l.stiffness;let wa=l.a.pinned?0:1,wb=l.b.pinned?0:1,s=wa+wb;if(!s)continue;wa/=s;wb/=s;l.a.x+=dx*e*wa;l.a.y+=dy*e*wa;l.b.x-=dx*e*wb;l.b.y-=dy*e*wb;}}
function integrate(n,dt,fx,fy,damping=.98){if(n.pinned)return;const vx=(n.x-n.px)*damping,vy=(n.y-n.py)*damping;n.px=n.x;n.py=n.y;n.x+=vx+fx*dt*dt;n.y+=vy+fy*dt*dt;}
function pin(n,x,y){n.x=n.px=x;n.y=n.py=y;}
function createDynamics(form='rowan'){
 const cols=5,rows=7,cloth=[];
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const u=x/(cols-1),v=y/(rows-1);cloth.push(node(34+u*(6+v*6)+v*3,29+v*19,y===0));}
 const clothLinks=[];
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const n=cloth[y*cols+x];if(x)clothLinks.push(link(n,cloth[y*cols+x-1]));if(y)clothLinks.push(link(n,cloth[(y-1)*cols+x]));if(x&&y)clothLinks.push(link(n,cloth[(y-1)*cols+x-1],undefined,.7));if(y>1)clothLinks.push(link(n,cloth[(y-2)*cols+x],undefined,.45));}
 const angles=form==='moontrail'?[-1.2,-.8,-.4,0,.4]:[-.1],length=form==='mature'?22:form==='moontrail'?21:20;
 const tails=angles.map((angle,index)=>{
  const nodes=Array.from({length:7},(_,i)=>node(35+Math.cos(angle)*length*i/6,42+Math.sin(angle)*length*i/6,i===0));
  return {nodes,angle,index,length,links:nodes.slice(1).map((n,i)=>link(nodes[i],n,length/6))};
 });
 return {form,cols,rows,cloth,clothLinks,tails,accumulator:0,clock:0};
}
function stepDynamics(sim,pose,elapsed,wind=1){
 // Fixed substeps and bounded catch-up prevent a hidden tab from exploding.
 for(let x=0;x<sim.cols;x++)pin(sim.cloth[x],pose.capeRoot.x+x/(sim.cols-1)*6,pose.capeRoot.y);
 for(const tail of sim.tails)pin(tail.nodes[0],pose.tailRoot.x,pose.tailRoot.y);
 sim.accumulator=Math.min(.05,sim.accumulator+clamp(elapsed,0,.05));
 const dt=1/120;
 while(sim.accumulator>=dt){
  sim.accumulator-=dt;sim.clock+=dt;
  const speed=pose.moving?1:0,gust=wind*(7+Math.sin(sim.clock*2.1)*5+speed*48);
  for(let x=0;x<sim.cols;x++)pin(sim.cloth[x],pose.capeRoot.x+x/(sim.cols-1)*6,pose.capeRoot.y);
  for(let i=sim.cols;i<sim.cloth.length;i++){
   const n=sim.cloth[i],u=(i%sim.cols)/(sim.cols-1),v=Math.floor(i/sim.cols)/(sim.rows-1),restX=pose.capeRoot.x+u*(6+v*6)+v*3,restY=pose.capeRoot.y+v*19;
   integrate(n,dt,gust+(restX-n.x)*18+Math.sin(sim.clock*5+i*.7)*7,22+(restY-n.y)*5,.985);
  }
  for(let pass=0;pass<7;pass++)solve(sim.clothLinks);
  for(const n of sim.cloth)if(!n.pinned){n.x=clamp(n.x,31,56);n.y=clamp(n.y,29,55);}
  for(const tail of sim.tails){
   pin(tail.nodes[0],pose.tailRoot.x,pose.tailRoot.y);
   const release=pose.releaseAge>=0?Math.exp(-pose.releaseAge*5)*Math.sin(pose.releaseAge*15-tail.index*.38):0;
   for(let i=1;i<tail.nodes.length;i++){
    const n=tail.nodes[i],t=i/6,wave=Math.sin(sim.clock*(pose.moving?8:2.8)-i*.55-tail.index*.45);
    const angle=tail.angle+wave*(pose.moving?.17:.065)*t+release*.22*t;
    const tx=pose.tailRoot.x+Math.cos(angle)*tail.length*t,ty=pose.tailRoot.y+Math.sin(angle)*tail.length*t;
    integrate(n,dt,(tx-n.x)*60+gust*.09,(ty-n.y)*60+wave*4,.972);
   }
   for(let pass=0;pass<8;pass++)solve(tail.links);
   for(const n of tail.nodes)if(!n.pinned){n.x=clamp(n.x,30,57);n.y=clamp(n.y,18,55);}
   for(let pass=0;pass<4;pass++)solve(tail.links);
  }
 }
 return sim;
}
function clothPoint(sim,u,v){
 const fx=clamp(u,0,1)*(sim.cols-1),fy=clamp(v,0,1)*(sim.rows-1),x=Math.min(sim.cols-2,Math.floor(fx)),y=Math.min(sim.rows-2,Math.floor(fy));
 return point(point(sim.cloth[y*sim.cols+x],sim.cloth[y*sim.cols+x+1],fx-x),point(sim.cloth[(y+1)*sim.cols+x],sim.cloth[(y+1)*sim.cols+x+1],fx-x),fy-y);
}
function tailPoint(tail,u,v,form){
 const f=clamp(u,0,1)*6,i=Math.min(5,Math.floor(f)),p=point(tail.nodes[i],tail.nodes[i+1],f-i),a=tail.nodes[Math.max(0,i-1)],b=tail.nodes[Math.min(6,i+2)],d=distance(a,b)||1;
 const width=(form==='moontrail'?9:form==='mature'?13:12)*(v-.5);
 return {x:p.x-(b.y-a.y)/d*width,y:p.y+(b.x-a.x)/d*width};
}
function dynamicsErrors(sim,pose){
 const lengths=sim.tails.flatMap(t=>t.links.map(l=>Math.abs(distance(l.a,l.b)-l.rest)));
 return {tailRoot:Math.max(...sim.tails.map(t=>distance(t.nodes[0],pose.tailRoot))),tailLength:Math.max(...lengths),capeRoot:Math.max(...sim.cloth.slice(0,sim.cols).map((n,i)=>distance(n,{x:pose.capeRoot.x+i/(sim.cols-1)*6,y:pose.capeRoot.y}))),bowGrip:distance(pose.bow.grip,pose.arms.right.end)};
}

const lerp=(a,b,t)=>a+(b-a)*t;
function prepareKit(image,metadata){
 const parts={};
 for(const [name,p]of Object.entries(metadata.parts)){
  const canvas=document.createElement('canvas');canvas.width=p.w;canvas.height=p.h;
  canvas.getContext('2d').drawImage(image,p.x,p.y,p.w,p.h,0,0,p.w,p.h);
  parts[name]={...p,image:canvas,pixels:canvas.getContext('2d').getImageData(0,0,p.w,p.h).data};
 }
 // Blink only the painted eye regions. The open head supplies the immutable
 // ears, fur outline and muzzle, even if a generated closed-head crop differs.
 const open=parts['head-open'],closed=parts['head-closed'],eyes=document.createElement('canvas');eyes.width=open.w;eyes.height=open.h;
 const ec=eyes.getContext('2d');ec.drawImage(open.image,0,0);ec.imageSmoothingEnabled=false;
 for(const [left,right]of [[.06,.28],[.35,.69]]){
  ec.save();ec.beginPath();ec.rect(left*open.w,.5*open.h,(right-left)*open.w,.31*open.h);ec.clip();ec.drawImage(closed.image,0,0,open.w,open.h);ec.restore();
 }
 const eyePixels=ec.getImageData(0,0,open.w,open.h);for(let n=3;n<eyePixels.data.length;n+=4)eyePixels.data[n]=open.pixels[n];ec.putImageData(eyePixels,0,0);
 parts['head-closed']={...open,image:eyes,pixels:eyePixels.data};
 const bow=parts.bow,scale=30/bow.h,grip=bow.grip;
 const offset=p=>({x:(p.x-grip.x)*scale,y:(p.y-grip.y)*scale});
 return {form:metadata.form,parts,bowProfile:{top:offset(bow.top),bottom:offset(bow.bottom)},palette:metadata.palette.map(hex=>hex.match(/../g).map(v=>parseInt(v,16))),colorCache:new Map()};
}
function fit(ctx,part,x,y,w,h){
 const scale=Math.min(w/part.w,h/part.h);ctx.drawImage(part.image,x-part.w*scale/2,y-part.h*scale/2,part.w*scale,part.h*scale);
}
function bone(ctx,part,a,b){
 const root=part.root||{x:part.w*.5,y:part.h*.12},tip=part.tip||{x:part.w*.5,y:part.h*.84},length=Math.hypot(tip.x-root.x,tip.y-root.y),scale=Math.hypot(b.x-a.x,b.y-a.y)/length;
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x)-Math.atan2(tip.y-root.y,tip.x-root.x));ctx.scale(scale,scale);ctx.drawImage(part.image,-root.x,-root.y);ctx.restore();
}
let meshSurface,meshContext,meshFrame;
function triangle(out,part,s0,s1,s2,p0,p1,p2){
 const denom=(p1.y-p2.y)*(p0.x-p2.x)+(p2.x-p1.x)*(p0.y-p2.y);if(Math.abs(denom)<1e-8)return;
 const left=Math.max(0,Math.floor(Math.min(p0.x,p1.x,p2.x))),right=Math.min(63,Math.ceil(Math.max(p0.x,p1.x,p2.x))),top=Math.max(0,Math.floor(Math.min(p0.y,p1.y,p2.y))),bottom=Math.min(63,Math.ceil(Math.max(p0.y,p1.y,p2.y)));
 for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){
  const xx=x+.5,yy=y+.5,a=((p1.y-p2.y)*(xx-p2.x)+(p2.x-p1.x)*(yy-p2.y))/denom,b=((p2.y-p0.y)*(xx-p2.x)+(p0.x-p2.x)*(yy-p2.y))/denom,c=1-a-b;
  if(a<-.00001||b<-.00001||c<-.00001)continue;
  const sx=Math.max(0,Math.min(part.w-1,Math.floor(a*s0.x+b*s1.x+c*s2.x))),sy=Math.max(0,Math.min(part.h-1,Math.floor(a*s0.y+b*s1.y+c*s2.y))),source=(sy*part.w+sx)*4,target=(y*64+x)*4;
  if(part.pixels[source+3]<128)continue;for(let k=0;k<4;k++)out[target+k]=part.pixels[source+k];
 }
}
function mesh(ctx,part,cols,rows,map){
 if(!meshSurface){meshSurface=document.createElement('canvas');meshSurface.width=meshSurface.height=64;meshContext=meshSurface.getContext('2d');meshFrame=meshContext.createImageData(64,64);}
 const output=meshFrame.data;output.fill(0);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const uv=[[x/cols,y/rows],[(x+1)/cols,y/rows],[x/cols,(y+1)/rows],[(x+1)/cols,(y+1)/rows]],s=uv.map(([u,v])=>({x:u*part.w,y:v*part.h})),p=uv.map(([u,v])=>map(u,v));
  triangle(output,part,s[0],s[1],s[2],p[0],p[1],p[2]);triangle(output,part,s[1],s[3],s[2],p[1],p[3],p[2]);
 }
 meshContext.putImageData(meshFrame,0,0);ctx.drawImage(meshSurface,0,0);
}
function calf(ctx,part,knee,ankle,foot){
 // A separate ankle keeps the authored boot flat and full-width even when
 // the shin folds almost horizontally during the recovery half-stride.
 const rootV=.12,ankleV=.68,scale=3/(part.h*(1-ankleV)),cx=part.w*.5,dx=ankle.x-knee.x,dy=ankle.y-knee.y,d=Math.hypot(dx,dy)||1;
 mesh(ctx,part,4,9,(u,v)=>{
  const offset=(u*part.w-cx)*scale;
  if(v>=ankleV)return {x:ankle.x+offset,y:ankle.y+(v-ankleV)*part.h*scale};
  const t=(v-rootV)/(ankleV-rootV),blend=Math.max(0,Math.min(1,(v-.4)/.28));
  let nx=lerp(dy/d,1,blend),ny=lerp(-dx/d,0,blend),n=Math.hypot(nx,ny)||1;nx/=n;ny/=n;
  return {x:lerp(knee.x,ankle.x,t)+nx*offset,y:lerp(knee.y,ankle.y,t)+ny*offset};
 });
}
function bow(ctx,part,pose){
 const scale=30/part.h,grip=part.grip||{x:part.w*.25,y:part.h*.5};
 ctx.drawImage(part.image,pose.bow.grip.x-grip.x*scale,pose.bow.grip.y-grip.y*scale,part.w*scale,part.h*scale);
 // Both endpoints and draw point come from the same physical bow pose.
 ctx.strokeStyle='#dfd8b1';ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(pose.bow.top.x,pose.bow.top.y);ctx.lineTo(pose.bow.draw.x,pose.bow.draw.y);ctx.lineTo(pose.bow.bottom.x,pose.bow.bottom.y);ctx.stroke();
}
function arrow(ctx,part,from,toward,length=18){
 const angle=Math.atan2(toward.y-from.y,toward.x-from.x),scale=length/part.w;
 ctx.save();ctx.translate(from.x,from.y);ctx.rotate(angle-Math.PI);ctx.drawImage(part.image,-part.w*scale,-part.h*scale/2,part.w*scale,part.h*scale);ctx.restore();
}
function renderCharacter(ctx,kit,pose,sim,{guides=false}={}){

 bone(ctx,p['thigh-left'],far.root,far.joint);calf(ctx,p['calf-left'],far.joint,far.end,far.foot);
 bone(ctx,p['thigh-right'],near.root,near.joint);calf(ctx,p['calf-right'],near.joint,near.end,near.foot);
 bone(ctx,p['upper-left'],pose.arms.left.root,pose.arms.left.joint);bone(ctx,p['fore-left'],pose.arms.left.joint,pose.arms.left.end);
 fit(ctx,p.torso,32,36.5+pose.bodyY,19,17);
 fit(ctx,p[pose.blink?'head-closed':'head-open'],pose.head.x,pose.head.y,27,28);
 bow(ctx,p.bow,pose);
 if(pose.attack&&pose.shotTime>.34&&pose.shotTime<1.05)arrow(ctx,p.arrow,pose.arms.left.end,{x:pose.bow.grip.x,y:pose.bow.grip.y-.5});
 bone(ctx,p['upper-right'],pose.arms.right.root,pose.arms.right.joint);bone(ctx,p['fore-right'],pose.arms.right.joint,pose.arms.right.end);

urceSha256":"6160d88db0d59a7f3d5ca7528c02c3d258a14d1653f6b34764e984e5e0190a56"}]};
const kits=await Promise.all(manifest.forms.map(async data=>{const image=new Image();image.src=data.image;await image.decode();return prepareKit(image,data);}));
const actors=kits.map(kit=>{
 const div=document.createElement('div');div.className='specimen';const label=document.createElement('div');label.className='label';label.textContent=names[kit.form];const canvas=document.createElement('canvas');canvas.width=320;canvas.height=256;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',names[kit.form]+' painted-part animation preview');div.append(label,canvas);$('specimens').append(div);
 const buffer=document.createElement('canvas');buffer.width=buffer.height=64;return {kit,canvas,buffer,sim:createDynamics(kit.form)};
});
let time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('pause').textContent=paused?'Play':'Pause';
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';};
$('native').onchange=()=>{$('specimens').classList.toggle('native',$('native').checked);};
$('action').onchange=()=>{time=0;actors.forEach(a=>a.sim=createDynamics(a.kit.form));};
function inspect(){
 $('parts').replaceChildren();const kit=kits.find(k=>k.form===$('parts-form').value);
 for(const name of PARTS){const part=kit.parts[name],div=document.createElement('div'),canvas=document.createElement('canvas'),label=document.createElement('span');div.className='part';canvas.width=canvas.height=64;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const scale=Math.min(56/part.w,56/part.h);ctx.drawImage(part.image,32-part.w*scale/2,32-part.h*scale/2,part.w*scale,part.h*scale);label.textContent=name;div.append(canvas,label);$('parts').append(div);}
}
$('parts-form').onchange=inspect;inspect();
function tick(now){
 const delta=last?Math.min(.25,(now-last)/1000):0;last=now;const dt=paused?0:delta*Number($('speed').value);time+=dt;
 let pose,errors=[];
 for(const actor of actors){pose=poseAt($('action').value,time,{stride:Number($('stride').value),bowProfile:actor.kit.bowProfile});actor.pose=pose;stepDynamics(actor.sim,pose,dt,Number($('wind').value));renderCharacter(actor.buffer.getContext('2d'),actor.kit,pose,actor.sim,{guides:$('guides').checked});renderScene(actor.canvas,actor.buffer,pose,actor.kit);errors.push(dynamicsErrors(actor.sim,pose));}
 $('status').textContent=pose.attackPhase+' · right-hand grip attached · '+(pose.blink?'blink':'eyes open');
 root.dataset.ready='true';root.dataset.action=$('action').value;
 window.foxLayeredPreview={actors,pose,errors,paused};requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function applyWidgetState(state){
 const m=state?.modelContent,p=state?.privateContent;
 if(['idle','run','attack'].includes(m?.action))$('action').value=m.action;
 if(Number.isFinite(m?.stride))$('stride').value=String(Math.max(.5,Math.min(1.5,m.stride)));
 if(Number.isFinite(m?.wind))$('wind').value=String(Math.max(0,Math.min(2,m.wind)));
 if(['rowan','mature','moontrail'].includes(m?.inspectedForm)){$('parts-form').value=m.inspectedForm;inspect();}
 if([1,.5,.25].includes(p?.speed))$('speed').value=String(p.speed);
 if(typeof p?.paused==='boolean')paused=p.paused;
 if(typeof p?.guides==='boolean')$('guides').checked=p.guides;
 if(typeof p?.native==='boolean')$('native').checked=p.native;
 $('pause').textContent=paused?'Play':'Pause';$('specimens').classList.toggle('native',$('native').checked);
}
function saveWidgetState(){
 if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'fox layered rig pilot',action:$('action').value,stride:Number($('stride').value),wind:Number($('wind').value),inspectedForm:$('parts-form').value},privateContent:{paused,speed:Number($('speed').value),guides:$('guides').checked,native:$('native').checked}}).catch(()=>{});
}
applyWidgetState(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)applyWidgetState(e.detail.globals.widgetState);});
root.addEventListener('change',saveWidgetState);$('pause').addEventListener('click',saveWidgetState);
})();
