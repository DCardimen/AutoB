<div id="fox-stocky-inline">
<style>
#fox-stocky-inline .specimens{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}
#fox-stocky-inline .specimen{text-align:center;min-width:0}
#fox-stocky-inline .specimen canvas{display:block;width:100%;max-width:400px;height:auto;margin:auto}
#fox-stocky-inline .native canvas{max-width:80px}
#fox-stocky-inline .label{margin:8px 0}
#fox-stocky-inline .parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
#fox-stocky-inline .part{text-align:center}
#fox-stocky-inline .part canvas{display:block;width:100%;max-width:96px;margin:auto}
#fox-stocky-inline details{margin-top:12px}
@media(max-width:560px){#fox-stocky-inline .specimens{grid-template-columns:1fr}#fox-stocky-inline .parts{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<div class="viz-controls">
 <label class="form-label">Motion<select class="form-select" data-control="action"><option value="idle">Idle &amp; blink</option><option value="run">Run</option><option value="attack" selected>Bow attack</option></select></label>
 <label class="form-label">Speed<select class="form-select" data-control="speed"><option value="1">Normal</option><option value="0.5">Half</option><option value="0.25">Quarter</option></select></label>
 <button class="btn" data-control="pause" type="button">Pause</button>
 <label class="form-check"><input class="form-check-input" data-control="guides" type="checkbox"><span class="form-check-label">Rig guides</span></label>
 <label class="form-check"><input class="form-check-input" data-control="native" type="checkbox"><span class="form-check-label">Game scale</span></label>
 <label class="form-label">Stride<input class="form-range" data-control="stride" type="range" min="0.5" max="1.5" value="1" step="0.1"></label>
 <label class="form-label">Wind<input class="form-range" data-control="wind" type="range" min="0" max="2" value="1" step="0.1"></label>
</div>
<div class="text-small">Base fox · SW motion pilot · preview only</div>
<div class="specimens" data-control="specimens"></div>
<div data-control="status" aria-live="off"></div>
<details><summary>Inspect painted parts</summary><input data-control="parts-form" type="hidden" value="rowan"><div class="parts" data-control="parts"></div></details>
<script>
(async()=>{
/* MODEL */
/* RENDERER */
/* PREVIEW */
function applyWidgetState(state){
 const m=state?.modelContent,p=state?.privateContent;
 if(['idle','run','attack'].includes(m?.action))$('action').value=m.action;
 if(Number.isFinite(m?.stride))$('stride').value=String(Math.max(.5,Math.min(1.5,m.stride)));
 if(Number.isFinite(m?.wind))$('wind').value=String(Math.max(0,Math.min(2,m.wind)));
 if([1,.5,.25].includes(p?.speed))$('speed').value=String(p.speed);
 if(typeof p?.paused==='boolean')paused=p.paused;
 if(typeof p?.guides==='boolean')$('guides').checked=p.guides;
 $('pause').textContent=paused?'Play':'Pause';
}
function saveWidgetState(){
 if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'stocky fox SW motion',action:$('action').value,stride:Number($('stride').value),wind:Number($('wind').value)},privateContent:{paused,speed:Number($('speed').value),guides:$('guides').checked}}).catch(()=>{});
}
applyWidgetState(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)applyWidgetState(e.detail.globals.widgetState);});
root.addEventListener('change',saveWidgetState);$('pause').addEventListener('click',saveWidgetState);
})();
</script>
</div>
