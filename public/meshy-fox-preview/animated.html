<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rowan archer v2</title>
<style>
body{margin:0;background:#172127;color:#edf1e6;font:15px system-ui}header{padding:16px 22px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}label{display:flex;gap:7px;align-items:center}select,button{background:#2c4145;color:#fff;border:1px solid #607a74;padding:7px;border-radius:5px}input[type=range]{width:150px}canvas{display:block;width:100%;height:650px}.timeline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 22px}.timeline input{flex:1;min-width:130px}footer{padding:8px 22px 16px;color:#b7c8bf}#stage{min-width:100px;color:#e6cc86}a{color:#b5e3b0}@media(max-width:500px){header{gap:10px}canvas{height:520px}h1{width:100%}}
</style></head><body>
<header><h1>Rowan · chibi archer v2</h1><label>Action <select id="action"></select></label><label>Bow angle <select id="bow"><option value="upright">Upright</option><option value="canted" selected>Canted</option><option value="tilted">Tilted</option></select></label><button id="play">Pause</button><label><input id="repeat" type="checkbox" checked>Repeat</label><label>Facing <select id="direction"><option value="0">S</option><option value="1">SE</option><option value="2">E</option><option value="3">NE</option><option value="4">N</option><option value="5">NW</option><option value="6">W</option><option value="7">SW</option></select></label><button id="blink">Blink</button><button id="ears">Ear twitch</button><button id="sniff">Sniff</button><label><input id="skeleton" type="checkbox">Rig guides</label><label><input id="tracking" type="checkbox">Track enemy</label><label>Enemy <input id="enemy" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label><label><input id="travel" type="checkbox">Travel</label></header>
<canvas id="animation" aria-label="Animated chibi fox archer; drag to orbit"></canvas>
<div class="timeline"><span id="stage" aria-live="polite">Loading</span><input id="time" aria-label="Animation time" type="range" min="0" max="4" step="0.005" value="0"><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div>
<footer>Base fox preview &middot; archer v2: held stance, quiver draw, bow drop, eyelids, straight tail &middot; <a href="./combat-demo.html">Combat demo</a> &middot; <a href="./fox-animated.glb">Download animated GLB</a> &middot; <a href="https://kaylousberg.itch.io/kaykit-character-animations">KayKit motion source</a></footer>
<script type="module" src="./animated-viewer.bundle.js"></script></body></html>
