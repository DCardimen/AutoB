<html lang="en">

<style>
body{margin:0;background:#172127;color:#edf1e6;font:15px system-ui}header{padding:16px 22px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}label{display:flex;gap:7px;align-items:center}select,button{background:#2c4145;color:white;border:1px solid #607a74;padding:7px;border-radius:5px}canvas{display:block;width:100%;height:650px}.timeline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 22px}.timeline input{flex:1;min-width:130px}footer{padding:8px 22px 16px;color:#b7c8bf}a{color:#b5e3b0}@media(max-width:500px){canvas{height:470px}h1{width:100%}}
